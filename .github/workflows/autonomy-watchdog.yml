name: Autonomy watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  pull_request:
    paths:
      - 'scripts/autonomy_ops.py'
      - 'scripts/test_autonomy_ops.py'
      - '.github/workflows/autonomy-watchdog.yml'
      - 'WORKER_BOOTSTRAP.md'
      - 'AI_INSTRUCTIONS.md'
      - 'docs/PRODUCT_UX_E2E_CONTRACT.md'
      - 'scripts/validate_product_ux_contract.py'
      - 'scripts/test_validate_product_ux_contract.py'
      - 'data/product-ux-e2e/**'
      - 'pages/index.html'
      - 'scripts/test_pages_filter_events.py'

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic autonomy regressions
        run: python3 scripts/test_autonomy_ops.py
      - name: Run Product/UX/E2E contract regressions
        run: python3 scripts/test_validate_product_ux_contract.py
      - name: Validate persisted Product/UX/E2E records
        run: |
          for file in data/product-ux-e2e/*.json; do
            python3 scripts/validate_product_ux_contract.py "$file"
          done
      - name: Run Pages filter event regression
        run: python3 scripts/test_pages_filter_events.py
      - name: Derive GitHub-native autonomy snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/autonomy_ops.py --output autonomy.json
      - name: Upload read-only autonomy snapshot
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-snapshot
          path: autonomy.json
          if-no-files-found: error
