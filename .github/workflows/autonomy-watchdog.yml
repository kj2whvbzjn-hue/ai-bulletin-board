name: Autonomy watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/autonomy_ops.py'
      - 'scripts/test_autonomy_ops.py'
      - 'scripts/lease_recovery.py'
      - 'scripts/test_lease_recovery.py'
      - '.github/workflows/autonomy-watchdog.yml'
      - 'WORKER_BOOTSTRAP.md'
      - 'AI_INSTRUCTIONS.md'
      - 'docs/PRODUCT_UX_E2E_CONTRACT.md'
      - 'scripts/validate_product_ux_contract.py'
      - 'scripts/test_validate_product_ux_contract.py'
      - 'data/product-ux-e2e/**'
      - 'pages/index.html'
      - 'scripts/test_pages_filter_events.py'
      - 'scripts/test_pages_narrow_task_visibility.py'
      - 'productization_v1/**'
      - 'scripts/test_productization_phase1.py'
      - 'scripts/test_productization_phase2_projection.py'
      - 'scripts/test_productization_phase2_console.py'
      - 'scripts/gap_scan.py'
      - 'scripts/test_gap_scan.py'
      - 'scripts/evidence_action_gate.py'
      - 'scripts/test_evidence_action_gate.py'
      - 'scripts/rule_governance.py'
      - 'scripts/test_rule_governance.py'

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic autonomy regressions
        id: autonomy_regressions
        run: python3 scripts/test_autonomy_ops.py
      - name: Run evidence-to-action terminal regressions
        id: evidence_action_regressions
        run: python3 scripts/test_evidence_action_gate.py
      - name: Run lease recovery regressions
        id: lease_recovery_regressions
        run: python3 scripts/test_lease_recovery.py
      - name: Run Product/UX/E2E contract regressions
        id: product_contract_regressions
        run: python3 scripts/test_validate_product_ux_contract.py
      - name: Validate persisted Product/UX/E2E records
        id: persisted_records
        run: |
          for file in data/product-ux-e2e/*.json; do
            python3 scripts/validate_product_ux_contract.py "$file"
          done
      - name: Run Pages filter event regression
        id: pages_filter_regression
        run: python3 scripts/test_pages_filter_events.py
      - name: Run Pages narrow task visibility regression
        id: pages_narrow_task_visibility
        run: python3 scripts/test_pages_narrow_task_visibility.py
      - name: Run Productization Phase-1 core regressions
        id: productization_phase1_regressions
        run: python3 scripts/test_productization_phase1.py
      - name: Run Productization Phase-2A operator projection regressions
        id: productization_phase2_projection_regressions
        run: python3 scripts/test_productization_phase2_projection.py
      - name: Run Productization Phase-2B console regressions
        id: productization_phase2_console_regressions
        run: python3 scripts/test_productization_phase2_console.py
      - name: Run rule governance regressions
        id: rule_governance_regressions
        run: python3 scripts/test_rule_governance.py
      - name: Run standing GAP_SCAN regressions
        id: gap_scan_regressions
        run: python3 scripts/test_gap_scan.py
      - name: Derive GitHub-native autonomy snapshot
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_BB_MAIN_VALIDATION_OUTCOME: ${{ steps.autonomy_regressions.outcome == 'success' && steps.evidence_action_regressions.outcome == 'success' && steps.lease_recovery_regressions.outcome == 'success' && steps.product_contract_regressions.outcome == 'success' && steps.persisted_records.outcome == 'success' && steps.pages_filter_regression.outcome == 'success' && steps.pages_narrow_task_visibility.outcome == 'success' && steps.productization_phase1_regressions.outcome == 'success' && steps.productization_phase2_projection_regressions.outcome == 'success' && steps.productization_phase2_console_regressions.outcome == 'success' && steps.gap_scan_regressions.outcome == 'success' && steps.rule_governance_regressions.outcome == 'success' && 'success' || 'failure' }}
        run: python3 scripts/autonomy_ops.py --output autonomy.json
      - name: Upload read-only autonomy snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-snapshot
          path: autonomy.json
          if-no-files-found: error
